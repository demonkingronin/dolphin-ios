name: Build iOS IPA

# Build only when explicitly requested. Avoids repeated expensive rebuilds
# while preparing a combined test with the user's existing LiveContainer data.
on:
  # A replacement IPA must use the exact identifier of the EXISTING installed app.
  # Avoid building an IPA that silently creates a separate LiveContainer guest.
  workflow_dispatch:
    inputs:
      existing_bundle_id:
        description: "Exact CFBundleIdentifier of existing DolphiniOS installation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240

    env:
      XCODE_PROJECT: Source/iOS/App/DolphiniOS.xcodeproj
      XCODE_DERIVED_DATA: ${{ github.workspace }}/build-Xcode
      ARCHIVE_PATH: ${{ github.workspace }}/archives/NonJailbroken.xcarchive
      TARGET_BUNDLE_ID: ${{ inputs.existing_bundle_id }}
      DOL_BUILD_SOURCE: development

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Xcode 26+ is required for the project's AppIcon_Glass.icon Icon Composer asset.
      - name: Apply Xcode 26 compatibility fix for bundled fmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("Externals/fmt/fmt/include/fmt/chrono.h")
          original = header.read_text()
          old = 'FMT_STRING("{:.{}f}")'
          new = 'fmt::runtime("{:.{}f}")'
          if original.count(old) != 1:
              raise SystemExit("Unexpected fmt version: expected one format call")
          header.write_text(original.replace(old, new, 1))
          print("Patched bundled fmt chrono dynamic-precision formatting for Xcode 26")
          PY

      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew install cmake ninja bartycrouch

      - name: Validate existing app identifier
        run: |
          python3 - <<'PY'
          import os
          import re
          bundle_id = os.environ.get("TARGET_BUNDLE_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)+", bundle_id):
              raise SystemExit("Use the exact CFBundleIdentifier from the existing installation.")
          print(f"Replacement bundle ID: {bundle_id}")
          PY

      - name: Build non-jailbroken app
        run: |
          mkdir -p archives products
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            -configuration "Release (Non-Jailbroken)" \
            -scheme "DiOS (NJB)" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            PRODUCT_BUNDLE_IDENTIFIER="$TARGET_BUNDLE_ID" \
            DOL_BUILD_SOURCE="$DOL_BUILD_SOURCE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Verify built IPA app identity
        run: |
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ARCHIVE_PATH/Products/Applications/DolphiniOS.app/Info.plist")"
          echo "Built CFBundleIdentifier: $ACTUAL_BUNDLE_ID"
          if [ "$ACTUAL_BUNDLE_ID" != "$TARGET_BUNDLE_ID" ]; then
            echo "::error::Built bundle ID does not match the original installed app ID."
            exit 1
          fi

      - name: Package IPA
        run: |
          "$GITHUB_WORKSPACE/Source/iOS/App/Project/Scripts/CreateIpa.sh" \
            "$ARCHIVE_PATH/Products/Applications/DolphiniOS.app" \
            "-" \
            "$GITHUB_WORKSPACE/Source/iOS/App/Project/Entitlements/Public.entitlements" \
            "$GITHUB_WORKSPACE/products/Non-Jailbroken.ipa"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-Combined-${{ github.sha }}
          path: products/*.ipa
          if-no-files-found: warn
          retention-days: 7
