name: Build DolphiniOS (iPhone)

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    env:
      XCODE_COMMON_BUILD_ARGS: -project Source/iOS/App/DolphiniOS.xcodeproj -derivedDataPath "${{ github.workspace }}/build-Xcode" -sdk iphoneos -destination generic/platform=iOS DOL_PBID_ORGANIZATION_IDENTIFIER="me.oatmealdome" DOL_BUILD_SOURCE="development" CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install build utilities
        run: |
          brew install cmake ninja bartycrouch dpkg

      - name: Build Non-Jailbroken app
        run: |
          mkdir -p "${{ github.workspace }}/archives"
          xcodebuild archive \
            -archivePath "${{ github.workspace }}/archives/NonJailbroken.xcarchive" \
            -configuration "Release (Non-Jailbroken)" \
            -scheme "DiOS (NJB)" \
            ${{ env.XCODE_COMMON_BUILD_ARGS }}

      - name: Package IPA for LiveContainer
        run: |
          mkdir -p "${{ github.workspace }}/products"
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" \
            "${{ github.workspace }}/archives/NonJailbroken.xcarchive/Products/Applications/DolphiniOS.app" \
            "-" \
            "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Public.entitlements" \
            "${{ github.workspace }}/products/Non-Jailbroken.ipa"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-LiveContainer-${{ github.sha }}
          path: "${{ github.workspace }}/products/*.ipa"
          if-no-files-found: warn
