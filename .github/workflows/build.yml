name: Build iOS IPA

# Build only when explicitly requested. Avoids repeated expensive rebuilds
# while preparing a combined test with the user's existing LiveContainer data.
on:
  # One combined test build after all features were committed.
  # Future source fixes on this branch also rebuild automatically.
  push:
    branches:
      - feature/controller-mapping-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240

    env:
      XCODE_PROJECT: Source/iOS/App/DolphiniOS.xcodeproj
      XCODE_DERIVED_DATA: ${{ github.workspace }}/build-Xcode
      ARCHIVE_PATH: ${{ github.workspace }}/archives/NonJailbroken.xcarchive
      # Preserve the original non-jailbroken DolphiniOS app identifier.
      # Verify this matches the app in LiveContainer BEFORE replacement.
      DOL_PBID_ORGANIZATION_IDENTIFIER: me.oatmealdome
      DOL_BUILD_SOURCE: development

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Xcode 26+ is required for the project's AppIcon_Glass.icon Icon Composer asset.
      - name: Apply Xcode 26 compatibility fix for bundled fmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("Externals/fmt/fmt/include/fmt/chrono.h")
          original = header.read_text()
          old = 'FMT_STRING("{:.{}f}")'
          new = 'fmt::runtime("{:.{}f}")'
          if original.count(old) != 1:
              raise SystemExit("Unexpected fmt version: expected one format call")
          header.write_text(original.replace(old, new, 1))
          print("Patched bundled fmt chrono dynamic-precision formatting for Xcode 26")
          PY

      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew install cmake ninja bartycrouch

      - name: Build non-jailbroken app
        run: |
          mkdir -p archives products
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            -configuration "Release (Non-Jailbroken)" \
            -scheme "DiOS (NJB)" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            DOL_PBID_ORGANIZATION_IDENTIFIER="$DOL_PBID_ORGANIZATION_IDENTIFIER" \
            DOL_BUILD_SOURCE="$DOL_BUILD_SOURCE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          "$GITHUB_WORKSPACE/Source/iOS/App/Project/Scripts/CreateIpa.sh" \
            "$ARCHIVE_PATH/Products/Applications/DolphiniOS.app" \
            "-" \
            "$GITHUB_WORKSPACE/Source/iOS/App/Project/Entitlements/Public.entitlements" \
            "$GITHUB_WORKSPACE/products/Non-Jailbroken.ipa"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-Combined-${{ github.sha }}
          path: products/*.ipa
          if-no-files-found: warn
          retention-days: 7
